---
- name: Clone Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/robbyrussell/oh-my-zsh.git
    dest: "{{ zsh_omz_dir }}"
    version: master

- name: Install zsh plugins
  ansible.builtin.git:
    repo: https://github.com/zsh-users/{{ item }}.git
    dest: "{{ zsh_omz_custom_dir }}/plugins/{{ item }}"
    depth: 1
    version: master
  with_items:
    - zsh-syntax-highlighting
    - zsh-autosuggestions

- name: Create zshrc file
  ansible.builtin.copy:
    src: "{{ zsh_omz_dir }}/templates/zshrc.zsh-template"
    dest: "{{ zsh_rc_file }}"
    mode: '0644'
    force: false

- name: Configure zsh plugins
  ansible.builtin.lineinfile:
    path: "{{ zsh_rc_file }}"
    regexp: ^plugins=
    line: plugins=(zsh-syntax-highlighting zsh-autosuggestions nvm sudo)

- name: Activate nvm autoload
  ansible.builtin.lineinfile:
    path: "{{ zsh_rc_file }}"
    insertafter: ^plugins=
    line: zstyle ':omz:plugins:nvm' autoload true
