---
- name: Install powerlebel10k theme
  ansible.builtin.git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "{{ zsh_omz_custom_dir }}/themes/powerlevel10k"
    depth: 1
    version: master

- name: Activate theme into .zshrc file
  ansible.builtin.lineinfile:
    path: "{{ zsh_rc_file }}"
    regexp: ^ZSH_THEME=
    line: ZSH_THEME="powerlevel10k/powerlevel10k"

- name: Copy powerlevel10k configuration
  ansible.builtin.copy:
    src: p10k.zsh
    dest: '{{ zsh_p10k_file }}'
    mode: '0644'

- name: Plug configuration into .zshrc file
  ansible.builtin.blockinfile:
    path: "{{ zsh_rc_file }}"
    marker: "# {mark} Powerlevel10k configuration"
    block: |
      [[ -f {{ zsh_p10k_file }} ]] && source {{ zsh_p10k_file }}
