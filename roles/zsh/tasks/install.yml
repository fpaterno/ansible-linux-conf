---
- name: Install zsh
  become: true
  ansible.builtin.package:
    name: zsh
    state: present

- name: "Set zsh to default shell for user {{ ansible_facts['user_id'] }}"
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh

- name: Deploy .zshrc
  ansible.builtin.copy:
    src: zshrc
    dest: "{{ ansible_facts['user_dir'] }}/.zshrc"
    mode: '0644'
