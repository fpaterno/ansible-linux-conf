---
- name: Install zsh and base CLI tools
  become: true
  ansible.builtin.package:
    name:
      - zsh
      - fzf
    state: present

- name: "Set zsh to default shell for user {{ ansible_facts['user_id'] }}"
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh
