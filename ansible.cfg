[defaults]
inventory = inventory
roles_path = roles
callbacks_enabled = profile_tasks
display_skipped_hosts = no
localhost_warning = False
stdout_callback = default

[callback_default]
result_format = yaml

[colors]
# Default "dark gray" is SGR 1;30 (bold black), unreadable on dark themes.
# Upstream closed this as working-as-intended and points at this very setting as
# the fix: https://github.com/ansible/ansible/issues/86430
# gray16 is SGR 38;5;248, a fixed index from the 256-color grayscale ramp, so it
# depends on neither the bold attribute nor the terminal palette.
doc_constant = gray16
