- name: Global Linux configuration
  hosts: all

  vars_files:
    - default.config.yml

  pre_tasks:
    - name: Verify Ansible meets setup version requirements
      ansible.builtin.assert:
        that: "ansible_version.full is version_compare('2.15', '>=')"
        msg: "You must update Ansible to at least 2.15 to use this setup."
      tags: ['always']

    - name: Include playbook configuration
      ansible.builtin.include_vars: "{{ item }}"
      with_fileglob:
        - "{{ playbook_dir }}/config.yml"
      tags: ['always']

  tasks:
    - name: Import SSH key tasks
      ansible.builtin.import_tasks: tasks/ssh_key.yml
      tags: ['ssh', 'minimal']

    - name: Import NVM tasks
      ansible.builtin.import_tasks: tasks/nvm.yml
      tags: ['nvm']

  roles:
    - role: git
      tags: ['git', 'minimal']

    - role: vim
      tags: ['vim', 'minimal']

    - role: zsh
      tags: ['zsh']

    - role: chrome
      tags: ['chrome']

    - role: vscode
      tags: ['vscode']

    - role: docker
      tags: ['docker']
