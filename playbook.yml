---
- name: Common base configuration
  hosts: all

  vars_files:
    - default.config.yml
    - config.yml

  pre_tasks:
    - name: Verify Ansible meets setup version requirements
      ansible.builtin.assert:
        that: "ansible_version.full is version('2.15', '>=')"
        fail_msg: "You must update Ansible to at least 2.15 to use this setup."
      tags: ['always']

  roles:
    - role: ssh_key
      tags: ['ssh', 'minimal']

    - role: vim
      tags: ['vim', 'minimal']

- name: Workstation base configuration
  hosts: workstations

  vars_files:
    - default.config.yml
    - config.yml

  pre_tasks:
    - name: Verify Ansible meets operating system requirements (Fedora)
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'RedHat'
          - ansible_facts['distribution'] == 'Fedora'
        fail_msg: "This workstation playbook is explicitly designed for Fedora."
      tags: ['always']

  roles:
    - role: git
      tags: ['git', 'minimal']

    - role: vscode
      tags: ['vscode']

    - role: docker
      tags: ['docker']

    - role: google_chrome
      tags: ['chrome']

    - role: tools
      tags: ['tools']

    - role: zsh
      tags: ['zsh']
